services:
  cdt-management:
    image: ghcr.io/beacherz/cdt-management:latest
    container_name: cdt-management
    restart: unless-stopped
    init: true
    ports:
      - "8282:8080"
    environment:
      TZ: Asia/Shanghai
      CDT_DATA_DIR: /data
      # 容器会自己把 /data 的属主调成 10001:10001，一般不用管。
      # 如果宿主机目录属于别的用户（NAS、家目录部署），填上这两行即可，
      # 容器就按该身份运行，不需要 sudo chown：
      # PUID: 1000
      # PGID: 1000
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health',timeout=4).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
