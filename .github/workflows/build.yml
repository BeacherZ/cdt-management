name: build

on:
  push:
    branches: [main, dev]
    tags: ['v*']
    # 只有会进镜像的文件（app/、web/、Dockerfile…）变了才值得重打一次多架构镜像。
    # 规则是「本次推送的改动必须全部落在下面这些范围里」才会跳过，只要有一个文件
    # 越界（比如改了 app/scheduler.py）就照常构建，不会漏掉真正的代码变更。
    # 另：路径过滤对 tag 推送不生效，打 v* 标签永远会构建，发版流程不受影响。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scripts/**'
      - '.gitignore'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/beacherz/cdt-management

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 一键脚本靠 cn.cdt-management.version 这个 label 判断要不要升级，
          # main 分支上每次构建都得不一样，否则永远显示「已是最新」
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            COMMIT=${{ github.sha }}
            BUILT_AT=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
