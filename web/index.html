<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 默认浅色：主题由后端设置决定，由 theme.ts 在运行时改写这两个 meta -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#eceff3" />
    <!-- 首屏防白闪：后端设置要等一次请求，那几百毫秒里深色用户会看到整页白底。
         这里先用上次真正呈现过的主题（localStorage）或系统偏好把属性写上，
         theme.ts 拿到后端设置后再纠正 —— 大多数情况下两者一致，不会闪。 -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('cdt_theme')
          var theme =
            saved === 'dark' || saved === 'light'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          if (theme === 'dark') document.documentElement.dataset.theme = 'dark'
          var scheme = document.querySelector('meta[name="color-scheme"]')
          if (scheme) scheme.setAttribute('content', theme)
          var color = document.querySelector('meta[name="theme-color"]')
          if (color) color.setAttribute('content', theme === 'dark' ? '#080b0f' : '#eceff3')
        } catch (e) {
          /* localStorage 被禁用（隐私模式）：退回 index.html 的默认浅色 */
        }
      })()
    </script>
    <title>CDT-Management</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230f8b63'/%3E%3Cstop offset='.46' stop-color='%230b7a58'/%3E%3Cstop offset='1' stop-color='%230a6d6b'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='10' fill='url(%23g)'/%3E%3Cg transform='translate(4 4)' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m17 2 4 4-4 4'/%3E%3Cpath d='M3 11v-1a4 4 0 0 1 4-4h14'/%3E%3Cpath d='m7 22-4-4 4-4'/%3E%3Cpath d='M21 13v1a4 4 0 0 1-4 4H3'/%3E%3C/g%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
